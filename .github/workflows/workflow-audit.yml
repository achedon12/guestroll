name: Workflows

# Reviews the workflows themselves: actionlint for syntax, expressions and shell
# scripts; zizmor for security (overly broad permissions, dangerous triggers,
# injections, unpinned actions, persisted credentials).
on:
  push:
    branches: [main, develop]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]

permissions: {}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
