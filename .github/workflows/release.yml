name: Release

# A version tag (v1.2.3), pushed from main, publishes the release: the
# multi-arch image (always to GHCR, to Docker Hub when DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN are set), each platform built natively, then a GitHub release
# with the changelog's notes.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Each platform builds on a runner of its own architecture: arm64 under QEMU on
  # an x86 runner crashed ("Illegal instruction") and left npm hanging until the
  # six-hour limit (v0.5.0). Natively it is also several times faster. Each job
  # pushes its image by digest, untagged; `image` joins them under the tags.
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: names
        run: |
          names="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$HAS_DOCKERHUB" = "true" ]; then names="$names,achedon12/guestroll"; fi
          echo "csv=$names" >> "$GITHUB_OUTPUT"
          echo "arch=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ steps.names.outputs.csv }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.names.outputs.arch }}
          cache-to: type=gha,mode=max,scope=${{ steps.names.outputs.arch }}
          provenance: true
          sbom: true

      - name: Keep the digest for the join
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ steps.names.outputs.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    name: Publish the image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: images
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY,,}"
            if [ "$HAS_DOCKERHUB" = "true" ]; then echo "achedon12/guestroll"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.images.outputs.list }}
          # latest follows the newest version tag (flavor latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # One multi-platform index per registry, from the two digests, under every tag.
      - name: Join the platforms under the tags
        working-directory: /tmp/digests
        env:
          IMAGES: ${{ steps.images.outputs.list }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r image; do
            [ -n "$image" ] || continue
            args=()
            while read -r tag; do
              case "$tag" in "$image":*) args+=(-t "$tag") ;; esac
            done <<< "$TAGS"
            refs=()
            for digest in *; do refs+=("$image@sha256:$digest"); done
            docker buildx imagetools create "${args[@]}" "${refs[@]}"
            docker buildx imagetools inspect "$image:$(echo "$TAGS" | head -1 | cut -d: -f2)"
          done <<< "$IMAGES"

      # Docker Scout also analyses every pushed tag on Docker Hub by itself (enabled
      # on the repository); this run puts the same report in the release's summary.
      - if: env.HAS_DOCKERHUB == 'true'
        name: Docker Scout vulnerabilities
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84 # v1.27.0
        with:
          command: cves,recommendations
          image: registry://achedon12/guestroll:${{ steps.meta.outputs.version }}
          only-fixed: true
          summary: true
          write-comment: false

      - if: env.HAS_DOCKERHUB == 'true'
        name: Sync the Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: achedon12/guestroll
          short-description: "Self-hosted QR-code photo sharing for events. Guests scan, shoot, done."
          readme-filepath: ./docs/docker-hub.md

  notes:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The install kit is the release's downloadable asset: it is what the
      # README's download badge counts (source archives aren't counted).
      - name: Build the install kit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          kit="guestroll-${TAG}-compose"
          mkdir "$kit"
          sed "s#ghcr.io/achedon12/guestroll:latest#ghcr.io/achedon12/guestroll:${TAG#v}#" docker-compose.yml > "$kit/docker-compose.yml"
          cp .env.example "$kit/.env.example"
          cat > "$kit/INSTALL.md" <<'EOF'
          # Guestroll: install kit

          1. Copy `.env.example` to `.env` and fill in at least `PUBLIC_URL` and `ADMIN_PASSWORD`.
          2. Start it: `docker compose up -d`
          3. Open `PUBLIC_URL/admin`, sign in as `admin`, create an event and print its QR code.

          Phones only open the camera on HTTPS pages: put Guestroll behind a reverse proxy
          with a certificate. Ready-made Caddy, Traefik and nginx setups:
          https://github.com/achedon12/guestroll/wiki/Deployment

          Every setting: https://github.com/achedon12/guestroll/wiki/Configuration
          EOF
          zip -qr "$kit.zip" "$kit"

      - name: Create the release with generated notes and the kit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # The notes are CHANGELOG.md's section for this version (the step fails
          # without one), followed by the generated list of pull requests.
          node scripts/changelog-section.mjs "$TAG" > notes.md
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber "guestroll-${TAG}-compose.zip"
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --generate-notes --notes-file notes.md --title "$TAG" "guestroll-${TAG}-compose.zip"
          fi
