name: Docker image

# Builds the image and runs it: the container must start, answer its health
# check, accept an upload and serve it back. Nothing is pushed here; releases
# publish from tags (release.yml).
on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - Dockerfile
      - docker/**
      - .dockerignore
      - docker-compose.yml
      - package.json
      - package-lock.json
      - next.config.ts
      - drizzle/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trivy's findings go to the Security tab (code scanning).
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: guestroll:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the container on a custom port and user
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          docker run -d --name guestroll -p 4000:4000 \
            -e PORT=4000 -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -e ADMIN_PASSWORD=ci-admin-password -e SECURE_COOKIES=false \
            -v "$RUNNER_TEMP/data:/data" guestroll:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs guestroll
          exit 1

      - name: Upload a photo end to end
        run: |
          base=http://127.0.0.1:4000
          jar=$(mktemp)
          curl -fsS -c "$jar" -b "$jar" -H "Origin: $base" -H 'Content-Type: application/json' \
            -d '{"password":"ci-admin-password"}' "$base/api/admin/login"
          slug=$(curl -fsS -c "$jar" -b "$jar" -H "Origin: $base" -H 'Content-Type: application/json' \
            -d '{"name":"CI party"}' "$base/api/admin/events" | jq -r .event.slug)
          guest=$(mktemp)
          curl -fsS -c "$guest" -b "$guest" -H "Origin: $base" -X POST "$base/api/e/$slug/join"
          # A real JPEG, drawn by the sharp shipped in the image.
          docker exec guestroll node -e "require('/app/node_modules/sharp')({create:{width:64,height:64,channels:3,background:'#ff8800'}}).jpeg().toBuffer().then((b)=>process.stdout.write(b))" > photo.jpg
          id=$(curl -fsS -c "$guest" -b "$guest" -H "Origin: $base" -F photo=@photo.jpg "$base/api/e/$slug/photos" | jq -r .photo.id)
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$guest" "$base/api/media/$id?v=thumb")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/media/$id?v=thumb")" = 404
          test -n "$(find "$RUNNER_TEMP/data/uploads" -name '*.original.jpg')"

      # What `docker pull` does to an instance in use: the latest release fills a
      # data folder, then this build starts on it. Migrations must apply and
      # nothing may be lost.
      - name: Upgrade from the latest release
        run: |
          base=http://127.0.0.1:4100
          data="$RUNNER_TEMP/upgrade"
          mkdir -p "$data"
          start() {
            docker run -d --name "$1" -p 4100:3000 -e PUID="$(id -u)" -e PGID="$(id -g)" \
              -e ADMIN_PASSWORD=ci-admin-password -e SECURE_COOKIES=false -v "$data:/data" "$2"
            for _ in $(seq 1 30); do
              if curl -fsS "$base/api/health" > /dev/null; then return 0; fi
              sleep 2
            done
            docker logs "$1"
            return 1
          }
          start previous ghcr.io/achedon12/guestroll:latest
          echo "Previous release: $(docker inspect previous --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          jar=$(mktemp)
          curl -fsS -c "$jar" -b "$jar" -H "Origin: $base" -H 'Content-Type: application/json' -d '{"password":"ci-admin-password"}' "$base/api/admin/login"
          event=$(curl -fsS -c "$jar" -b "$jar" -H "Origin: $base" -H 'Content-Type: application/json' \
            -d '{"name":"Before the upgrade","description":"Kept","accentColor":"#336699"}' "$base/api/admin/events")
          event_id=$(echo "$event" | jq -r .event.id)
          slug=$(echo "$event" | jq -r .event.slug)
          guest=$(mktemp)
          curl -fsS -c "$guest" -b "$guest" -H "Origin: $base" -X POST "$base/api/e/$slug/join"
          photo_id=$(curl -fsS -c "$guest" -b "$guest" -H "Origin: $base" -F photo=@photo.jpg "$base/api/e/$slug/photos" | jq -r .photo.id)
          docker stop previous > /dev/null

          start upgraded guestroll:ci
          jar=$(mktemp)
          curl -fsS -c "$jar" -b "$jar" -H "Origin: $base" -H 'Content-Type: application/json' -d '{"username":"admin","password":"ci-admin-password"}' "$base/api/admin/login"
          curl -fsS -b "$jar" "$base/api/admin/events/$event_id" | jq -e '.event.name == "Before the upgrade" and .event.description == "Kept" and .event.accentColor == "#336699"'
          curl -fsS -b "$jar" "$base/api/admin/events/$event_id/photos" | jq -e --arg id "$photo_id" '[.photos[].id] == [$id]'
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "$base/api/media/$photo_id?v=original")" = 200
          # The guest's cookie from before the upgrade still opens their photo.
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$guest" "$base/api/media/$photo_id?v=thumb")" = 200

      - name: Upgrade logs
        if: failure()
        run: |
          docker logs previous || true
          docker logs upgraded || true

      # Vulnerabilities in the image (Alpine packages and node_modules): every
      # finding to the Security tab, and the build fails on a critical one that
      # already has a fix.
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: guestroll:ci
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM

      - name: Publish the scan
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: guestroll:ci
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"
          skip-setup-trivy: true

      - name: Container logs
        if: failure()
        run: docker logs guestroll
